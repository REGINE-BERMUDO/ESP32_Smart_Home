; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf


; Serial communication through the CH343 USB connection.
monitor_speed = 115200
upload_port = COM10
monitor_port = COM10

; Match the module's N16 flash capacity.
board_upload.flash_size = 16MB

; Use a 2 MB application partition for Wi-Fi, web, and Bluetooth.
board_build.partitions = partitions.csv

; Keep SDK initializer warnings visible without failing the C++ build.
build_flags =
    -Wno-error=missing-field-initializers

; Generate the embedded web assets for PlatformIO's ESP-IDF build.
board_build.embed_files =
    web/index.html
    web/app.js
    web/inter-latin.woff2
    web/licenses.txt
